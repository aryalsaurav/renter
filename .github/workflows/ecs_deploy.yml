name: ECS Build and Deploy

on:
    pull_request:
        branches: [main]
        types: [closed]
    push:
        branches: [main]

# on:
#     workflow_dispatch:

permissions:
    id-token: write
    contents: read

concurrency:
    group: production
    cancel-in-progress: true

jobs:
    build-and-deploy:
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: configure-aws
              uses: aws-actions/configure-aws-credentials@v5
              with:
                role-to-assume: ${{vars.AWS_DEPLOY_ROLE_ARN}}
                aws-region: ${{vars.AWS_REGION}}
            
            - name: Get aws sts identity
              run: aws sts get-caller-identity
            
            - name: ECR login
              uses: aws-actions/amazon-ecr-login@v2
            
            - name: Store image tag on env
              run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV
            
            - name: Docker build and push
              uses: docker/build-push-action@v7
              with:
                context: .
                file: docker/Dockerfile.prod
                push: true
                tags: |
                    ${{ vars.AWS_ECR_REPO }}:${{ env.IMAGE_TAG }}
            
            # migration task
            - name: Download Migration current task definition
              run: |
                aws ecs describe-task-definition \
                --task-definition renter-web-migration \
                --query taskDefinition > migration-task-definition.json
            
            - name: Update task definition with new image
              id: migrate
              uses: aws-actions/amazon-ecs-render-task-definition@v1
              with: 
                task-definition: migration-task-definition.json
                container-name: server-migration
                image: ${{vars.AWS_ECR_REPO}}:${{ env.IMAGE_TAG }}
            
            - name: Run schema migration task
              uses: aws-actions/amazon-ecs-deploy-task-definition@v2
              with:
                task-definition: ${{steps.migrate.outputs.task-definition}}
                cluster: ${{vars.CLUSTER_NAME}}
                run-task: true
                run-task-launch-type: EC2
                wait-for-task-stopped: true
                run-task-subnets: ${{secrets.VPC_SUBNETS}}
                run-task-security-groups: ${{secrets.TASK_SECURITY_GROUP}}
            
            # server
            - name: Download current task definition
              run: |
                aws ecs describe-task-definition \
                --task-definition renter-web \
                --query taskDefinition > task-definition.json
            
            - name: Update task definition with new image
              id: task-def
              uses: aws-actions/amazon-ecs-render-task-definition@v1
              with: 
                task-definition: task-definition.json
                container-name: ${{vars.CONTAINER_NAME}}
                image: ${{vars.AWS_ECR_REPO}}:${{ env.IMAGE_TAG }}
            
            - name: Update Service and deploy
              uses: aws-actions/amazon-ecs-deploy-task-definition@v2
              with:
                task-definition: ${{steps.task-def.outputs.task-definition}}
                service: ${{vars.SERVICE_NAME}}
                cluster: ${{vars.CLUSTER_NAME}}
                wait-for-service-stability: true