apiVersion: apps/v1
kind: Deployment

metadata:
  name: api
  namespace: rental

spec:
  replicas: 2

  selector:
    matchLabels:
      app: renter
      component: api
    
  template:
    metadata:
      labels:
        app: renter
        component: api

    spec:
      containers:
        - name: server
          image: renter:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          args:
            - python
            - manage.py
            - runserver
            - 0.0.0.0:8000
          
          envFrom:
            - configMapRef:
                name: renter-config
              
            - secretRef:
                name: renter-secret
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            
            periodSeconds: 10
            failureThreshold: 20
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"

