apiVersion: apps/v1
kind: Deployment

metadata:
  name: api
  namespace: rental

spec:
  replicas: 2

  selector:
    matchLabels:
      app: renter
      component: api
    
  template:
    metadata:
      labels:
        app: renter
        component: api

    spec:
      containers:
        - name: server
          image: renter:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          args:
            - python
            - manage.py
            - runserver
            - 0.0.0.0:8000
          
          env:
            - name: DJANGO_ALLOWED_HOSTS
              value: localhost
            
            - name: POSTGRES_HOST
              value: postgres
            
            - name: POSTGRES_DB
              value: renter
            
            - name: POSTGRES_USER
              value: postgres
            
            - name: POSTGRES_PORT
              value: "5432"
            
            - name: DEBUG
              value: "True"
            
            - name: DJANGO_SECRET_KEY
              value: "o9vjc$6e@s$_g^$8ud3fl1_%rl7lps*0_^2)thzqiawezx4p(i"
            
            - name: REDIS_URL
              value: redis://redis:6379/0
            
            - name: CELERY_BROKER_URL
              value: redis://redis:6379/0

