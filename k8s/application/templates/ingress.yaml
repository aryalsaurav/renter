apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: {{.Values.app }}-ingress
  namespace: {{ .Values.namespace }}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging


spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - renter.aryalsaurav.com.np
      secretName: renter-tls
  rules:
    - host: renter.aryalsaurav.com.np
      http:
        paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: api
                port: 
                  number: 80
