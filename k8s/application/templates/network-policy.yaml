apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: api-policy
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"

spec:
  podSelector:
    matchLabels:
      app: {{ .Values.app }}
      component: api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - ipBlock:
            cidr: {{ .Values.config.cidr_block | quote }}
      ports:
        - {port: 8000, protocol: TCP}
  egress:
    - ports: 
        - {port: 53, protocol: TCP}
        - {port: 53, protocol: UDP}
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
    - to:
      - ipBlock:
          cidr: {{ .Values.config.cidr_block | quote }}
      ports:
        - {port: 5432, protocol: TCP}
        - {port: 6379, protocol: TCP}

