apiVersion: apps/v1
kind: Deployment

metadata:
  name: postgres
  namespace: rental

spec:
  replicas: 1
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: renter
      component: db
  
  template:
    metadata:
      labels:
        app: renter
        component: db
  
    spec:
      containers:
        - name: db
          image: postgres:16
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: renter-config
            
            - secretRef:
                name: renter-secret
          
          volumeMounts: 
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
