name: renter-local

services:
  postgres:
    image: postgres:16-alpine
    container_name: renter_postgres_local
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-renter}
      POSTGRES_USER: ${POSTGRES_USER:-renter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-renter}
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
    ports:
      - "5431:5431"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-renter}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: renter_redis_local
    ports:
      - "6379:6379"

  django:
    build:
      context: .
      dockerfile: ./docker/local/django/Dockerfile
    image: renter_local_django
    container_name: renter_django_local
    command: /start.sh
    volumes:
      - .:/app
      - media_local:/app/media
    env_file:
      - .env
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  celeryworker:
    image: renter_local_django
    container_name: renter_celeryworker_local
    command: /start-celeryworker.sh
    volumes:
      - .:/app
      - media_local:/app/media
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
      - django

  celerybeat:
    image: renter_local_django
    container_name: renter_celerybeat_local
    command: /start-celerybeat.sh
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
      - django

volumes:
  postgres_data_local: {}
  media_local: {}
