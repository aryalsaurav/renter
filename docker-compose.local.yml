services:
  db:
     image: postgres:16
     volumes:
      - postgres-db-data:/var/lib/postgresql/data
     env_file:
       - .env
     ports:
       - "5431:5432"
     healthcheck:
       test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
       interval: 10s
       retries: 5
       timeout: 5s

  web:
     build: .
     image: renter:latest
     volumes:
       - .:/app
     depends_on:
      db:
        condition: service_healthy
     restart: always
     env_file:
      - .env
     environment:
      RUN_MIGRATIONS: "true"
     ports:
       - "8001:8001"
     command: "python manage.py runserver 0.0.0.0:8001"
     healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 30s
      retries: 5

  redis:
     image: redis:latest
     env_file:
      - .env

  celery:
    image: renter:latest
    depends_on:
      - db
      - redis
      - web
    env_file:
      - .env
    command: celery -A cicd_proj.celery worker --loglevel=info

  celery_beat:
    image: renter:latest
    command: celery -A cicd_proj.celery beat --loglevel=info
    env_file:
      - .env
    depends_on:
      - db
      - redis
      - web
      - celery


volumes:
  postgres-db-data:
