apiVersion: v1
kind: ConfigMap

metadata:
  name: prometheus-config
  namespace: monitoring

data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: "django-pods"
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels:
              - __meta_kubernetes_pod_label_prometheus
            action: keep
            regex: "true"

          - source_labels:
              - __meta_kubernetes_pod_container_port_name
            action: keep
            regex: "django"

          - source_labels:
              - __meta_kubernetes_namespace
            target_label: namespace

          - source_labels:
              - __meta_kubernetes_pod_name
            target_label: pod
          - source_labels:
              - __meta_kubernetes_pod_label_app
            target_label: app
          - source_labels:
              - __meta_kubernetes_pod_label_component
            target_label: component
  
      - job_name: "kube-state-metrics"
        kubernetes_sd_configs:
          - role: endpointslice
            namespaces:
              names: 
                - monitoring
        relabel_configs:
          - source_labels:
              - __meta_kubernetes_service_name
            action: keep
            regex: kube-state-metrics
          - source_labels:
              - __meta_kubernetes_endpointslice_port_name
            action: keep
            regex: metrics
          - source_labels:
              - __meta_kubernetes_namespace
            target_label: namespace
          - source_labels:
              - __meta_kubernetes_pod_name
            target_label: pod

