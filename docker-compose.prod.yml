services:
  db:
     image: postgres:16
     volumes:
      - postgres-data:/var/lib/postgresql/data
     env_file:
      - .env
     healthcheck:
       test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
       interval: 10s
       retries: 5
       timeout: 5s

  web:
     build:
       context: .
       dockerfile: docker/Dockerfile.prod
     image: renter:latest
     volumes:
       - .:/app
     depends_on:
      db:
        condition: service_healthy
     restart: always
     env_file:
      - .env
     ports:
       - "8000:8000"
     command: "gunicorn config.wsgi:application --bind 0.0.0.0:8000"
     healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 30s
      retries: 5

  redis:
     image: redis:latest
     env_file:
      - .env

  celery:
    image: renter:latest
    depends_on:
      - db
      - redis
      - web
    env_file:
      - .env
    command: celery -A config.celery worker --loglevel=info

  celery_beat:
    image: renter:latest
    command: celery -A config.celery beat --loglevel=info
    env_file:
      - .env
    depends_on:
      - db
      - redis
      - web
      - celery


volumes:
  postgres-data:
