replicas: 6
image:
  repository: renter
  tag: latest
resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "1"
    memory: "2Gi"

config:
  djangoDebug: true
  djangoAllowedHosts: "localhost,127.0.0.1,renter.local"
  postgresUser: "postgres"
  postgresDb: "renter"

maxSurge: 2
maxUnavailable: 1
minReplicas: 2
maxReplicas: 10


  

